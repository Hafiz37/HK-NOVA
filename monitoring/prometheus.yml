global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'hk-nova-production'
    environment: 'production'

scrape_configs:
  - job_name: 'hk-nova-app'
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'hk-nova'
          instance: 'app-1'
    metrics_path: '/api/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql:3306']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - '/etc/prometheus/rules/*.yml'
