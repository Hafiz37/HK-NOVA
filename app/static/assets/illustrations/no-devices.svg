<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#grad1)" opacity="0.1"/>
  <g transform="translate(250, 200)">
    <!-- Router/Device Icon -->
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="#334155" stroke="#6366f1" stroke-width="3"/>
    <circle cx="-30" cy="-10" r="6" fill="#6366f1" opacity="0.5"/>
    <circle cx="0" cy="-10" r="6" fill="#6366f1" opacity="0.5"/>
    <circle cx="30" cy="-10" r="6" fill="#6366f1" opacity="0.5"/>
    <rect x="-50" y="15" width="30" height="15" rx="2" fill="#1e293b"/>
    <rect x="-10" y="15" width="30" height="15" rx="2" fill="#1e293b"/>
    <rect x="30" y="15" width="20" height="15" rx="2" fill="#1e293b"/>
    
    <!-- Plus Sign -->
    <g transform="translate(70, -60)">
      <circle r="25" fill="#6366f1" opacity="0.2"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Text -->
    <text x="0" y="100" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="18" font-weight="600">No Devices Yet</text>
    <text x="0" y="125" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">Add your first network device to get started</text>
  </g>
</svg>
