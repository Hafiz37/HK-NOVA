<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#grad2)" opacity="0.1"/>
  <g transform="translate(250, 180)">
    <!-- Archive/Backup Box -->
    <rect x="-70" y="-50" width="140" height="100" rx="10" fill="#334155" stroke="#10b981" stroke-width="3"/>
    <rect x="-60" y="-40" width="120" height="15" rx="3" fill="#1e293b"/>
    <line x1="-40" y1="-15" x2="-40" y2="30" stroke="#10b981" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-15" x2="0" y2="30" stroke="#10b981" stroke-width="2" opacity="0.5"/>
    <line x1="40" y1="-15" x2="40" y2="30" stroke="#10b981" stroke-width="2" opacity="0.5"/>
    
    <!-- Cloud -->
    <g transform="translate(0, -100)" opacity="0.3">
      <ellipse cx="-20" cy="0" rx="30" ry="20" fill="#10b981"/>
      <ellipse cx="20" cy="0" rx="35" ry="25" fill="#10b981"/>
      <ellipse cx="0" cy="-10" rx="25" ry="18" fill="#10b981"/>
    </g>
    
    <!-- Text -->
    <text x="0" y="90" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="18" font-weight="600">No Backups Found</text>
    <text x="0" y="115" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">Trigger your first backup to see it here</text>
  </g>
</svg>
