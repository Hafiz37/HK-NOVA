<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#grad4)" opacity="0.1"/>
  <g transform="translate(250, 180)">
    <!-- Magnifying glass -->
    <circle r="50" fill="none" stroke="#64748b" stroke-width="4"/>
    <line x1="35" y1="35" x2="70" y2="70" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    
    <!-- X mark inside -->
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="-20" x2="-20" y2="20" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Text -->
    <text x="0" y="110" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="18" font-weight="600">No Results Found</text>
    <text x="0" y="135" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">Try adjusting your search or filters</text>
  </g>
</svg>
