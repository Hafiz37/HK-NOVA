<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#grad3)" opacity="0.1"/>
  <g transform="translate(250, 180)">
    <!-- Clock -->
    <circle r="60" fill="#334155" stroke="#f59e0b" stroke-width="3"/>
    <circle r="5" fill="#f59e0b"/>
    <line x1="0" y1="0" x2="0" y2="-35" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="25" y2="0" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Clock markers -->
    <circle cx="0" cy="-50" r="3" fill="#64748b"/>
    <circle cx="50" cy="0" r="3" fill="#64748b"/>
    <circle cx="0" cy="50" r="3" fill="#64748b"/>
    <circle cx="-50" cy="0" r="3" fill="#64748b"/>
    
    <!-- Calendar icon small -->
    <g transform="translate(75, -75)">
      <rect x="-15" y="-15" width="30" height="35" rx="3" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
      <rect x="-15" y="-15" width="30" height="10" rx="3" fill="#f59e0b"/>
      <line x1="-8" y1="-20" x2="-8" y2="-10" stroke="#f59e0b" stroke-width="2"/>
      <line x1="8" y1="-20" x2="8" y2="-10" stroke="#f59e0b" stroke-width="2"/>
    </g>
    
    <!-- Text -->
    <text x="0" y="110" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="18" font-weight="600">No Schedules Configured</text>
    <text x="0" y="135" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">Create a schedule to automate backups</text>
  </g>
</svg>
