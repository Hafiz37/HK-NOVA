<!-- Skeleton Loading Table -->
<div class="skeleton-table">
    <table class="table">
        <thead>
            <tr>
                <th><div class="skeleton skeleton-text" style="width: 60%; height: 12px;"></div></th>
                <th><div class="skeleton skeleton-text" style="width: 70%; height: 12px;"></div></th>
                <th><div class="skeleton skeleton-text" style="width: 50%; height: 12px;"></div></th>
                <th><div class="skeleton skeleton-text" style="width: 40%; height: 12px;"></div></th>
            </tr>
        </thead>
        <tbody>
            {% for i in range(5) %}
            <tr>
                <td><div class="skeleton skeleton-text" style="width: 80%; height: 12px;"></div></td>
                <td><div class="skeleton skeleton-text" style="width: 60%; height: 12px;"></div></td>
                <td><div class="skeleton skeleton-text" style="width: 70%; height: 12px;"></div></td>
                <td><div class="skeleton skeleton-text" style="width: 50%; height: 12px;"></div></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
