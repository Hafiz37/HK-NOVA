<!-- Enhanced Stat Card Component -->
{% macro stat_card(title, value, icon, color='primary', trend='', trend_value='', subtext='') %}
<div class="col-md-3">
    <div class="card stat-card stat-card-{{ color }} h-100">
        <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="card-title mb-0">
                    <i class="bi bi-{{ icon }}"></i> {{ title }}
                </h5>
                {% if trend %}
                <span class="trend-badge trend-{{ 'up' if trend == 'up' else 'down' }}">
                    <i class="bi bi-arrow-{{ 'up' if trend == 'up' else 'down' }}"></i> {{ trend_value }}
                </span>
                {% endif %}
            </div>
            <div class="stat-value mt-auto" data-value="{{ value }}">{{ value }}</div>
            {% if subtext %}
            <small class="text-muted stat-subtext">{{ subtext }}</small>
            {% endif %}
        </div>
        <div class="stat-card-glow"></div>
    </div>
</div>
{% endmacro %}
