# HK-NOVA Nginx Reverse Proxy Configuration
# Install: sudo cp scripts/nginx-hk-nova.conf /etc/nginx/sites-available/hk-nova
# Enable: sudo ln -s /etc/nginx/sites-available/hk-nova /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# Upstream HK-NOVA Next.js Application
upstream hk_nova_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

# HTTP to HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your domain (e.g., noc.example.com)

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;  # Replace with your domain

    # SSL Configuration (Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/_/fullchain.pem;  # Replace _ with your domain
    ssl_certificate_key /etc/letsencrypt/live/_/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (uncomment after verifying HTTPS works)
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Client max body size for file uploads
    client_max_body_size 50M;

    # Proxy Settings for SSE (Server-Sent Events)
    proxy_http_version 1.1;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;  # Critical for SSE realtime streaming

    # Login rate limiting
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://hk_nova_backend;
    }

    # API rate limiting
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://hk_nova_backend;
    }

    # WebSocket/SSE endpoints (no rate limiting for realtime)
    location /api/realtime/ {
        proxy_pass http://hk_nova_backend;
    }

    location /api/health {
        # Health check endpoint - no rate limiting
        proxy_pass http://hk_nova_backend;
    }

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://hk_nova_backend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image/ {
        proxy_pass http://hk_nova_backend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main application
    location / {
        proxy_pass http://hk_nova_backend;
    }

    # Logging
    access_log /var/log/nginx/hk-nova-access.log;
    error_log /var/log/nginx/hk-nova-error.log;
}